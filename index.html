<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="conatiner">
        <h1>Student Registration Form</h1>
        <form action="#">
            <div class="row">
                <label for="roll-no">Roll no. :</label>
                <input type="text">
            </div>
            <div class="row">
                <label for="studentname">Student name :</label>
                <div class="input">
                    <input type="text" placeholder="First Name">
                    <div class="point"></div>
                    <input type="text" placeholder="Last Name">
                </div>
            </div>
            <div class="row">
                <label for="date-of-birth">Date of birth :</label>
                <input type="text" placeholder="Day">
                <div class="point"></div>
                <input type="text" placeholder="Month">
                <div class="point"></div>
                <input type="text" placeholder="Year">
                <div class="point"></div>
                <span class="date">(DD-MM-YYYY)</span>
            </div>
            <div class="row">
                <label for="mobile-no">Mobile no. :</label>
                <input type="text" placeholder="+885">
                <div class="point"></div>
                <input type="text">
            </div>
            <div class="row">
                <label for="email">Email id :</label>
                <input type="email">
            </div>
            <div class="row">
                <label for="password">Password</label>
                <input type="password">
            </div>
            <div class="row">
                <label for="gender">Gender :</label>
                <div class="radio">
                    <input type="radio"> Male
                    <input type="radio"> Female
                </div>
            </div>
            <div class="row">
                <label for="department">Department :</label>
                <div class="checkbox">
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </div>
            </div>
            <div class="row">
                <label for="course">Course :</label>
                <select name="course" id="course">
                    <option value="">..........Select Current Course's..........</option>
                </select>
            </div>
            <div class="row">
                <label for="studentphoto">Student photo :</label>
                <input type="file">
            </div>
            <div class="row">
                <label for="city">City :</label>
                <input type="text">
            </div>
            <div class="row">
                <label for="address">Address :</label>
                <input type="text">
            </div>
            <div class="btn">
                <button type="submit">Register</button>
            </div>
        </form>
    </div>
</body>
</html>
